{{define "content"}}
<h2>Добавить расход</h2>
<form method="POST" action="/" style="display:flex; flex-direction:column; gap:10px; max-width:400px; margin-bottom:30px;">
    <input type="number" step="0.01" name="amount" placeholder="Сумма" required style="padding:8px;">
    <input type="text" name="description" placeholder="Описание" required style="padding:8px;">
    <input type="date" name="date" required style="padding:8px;">
    <button type="submit" style="background:#27ae60; color:#fff; border:none; padding:10px; cursor:pointer;">Сохранить</button>
</form>
<h2>История трат</h2>
<table border="1" cellpadding="10" cellspacing="0" style="width:100%; border-collapse:collapse;">
    <tr style="background:#f2f2f2;"><th>Описание</th><th>Сумма</th><th>Дата</th></tr>
    {{range .Expenses}}
    <tr><td>{{.Description}}</td><td><strong>{{printf "%.2f" .Amount}} ₽</strong></td><td>{{.Date.Format "2006-01-02"}}</td></tr>
    {{end}}
</table>
{{end}}
