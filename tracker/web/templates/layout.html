{{define "layout"}}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #fafafa; }
        .nav { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .nav a { margin-right: 10px; text-decoration: none; color: blue; }
    </style>
</head>
<body>

    <div class="nav">
        <div>
            <a href="/">Главная</a>
            <a href="/about">О проекте</a>
            <a href="/ping">Ping</a>
        </div>
        <!-- Поменяли .IsAuth на .IsAuth в соответствии сhandlers.go -->
        {{if .IsAuth}}
        <div>
            <a href="/logout" style="color: red; font-weight: bold;">Выйти</a>
        </div>
        {{end}}
    </div>

    <hr>

    <div>
        {{template "content" .}}
    </div>

</body>
</html>
{{end}}
