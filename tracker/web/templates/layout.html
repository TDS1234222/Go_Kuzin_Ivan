{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        header { background-color: #2c3e50; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; }
        nav a { color: #fff; text-decoration: none; margin-left: 15px; font-weight: bold; }
        main { padding: 20px; max-width: 800px; margin: 30px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<header>
    <h1>Учёт трат</h1>
    <nav><a href="/">Главная</a><a href="/about">О проекте</a><a href="/ping">Ping</a></nav>
</header>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
